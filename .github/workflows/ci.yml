name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Only lints files this PR touches — the repo has pre-existing lint
      # debt (tracked in TECHNICAL.md) that isn't this workflow's job to fix.
      - name: Lint changed files
        run: npx biome check --changed --since=origin/${{ github.base_ref }} --no-errors-on-unmatched

      - name: Test
        run: npm run test
